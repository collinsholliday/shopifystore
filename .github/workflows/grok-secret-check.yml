
name: Grok Secret Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    name: Check xAI secret is available
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret is present without displaying it
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error::XAI_API_KEY is not available to this workflow."
            exit 1
          fi
          echo "XAI_API_KEY is available to this workflow."
          echo "No request was sent to xAI. No API usage was incurred."
